<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temple Album showcasing temples from around the world.">
    <meta name="author" content="Julius Conteh">

    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-container">
            <span class="site-name">Temple Album</span>

            <button id="menu" aria-label="Open Navigation Menu">
                ☰
            </button>

            <nav class="navigation">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Old</a></li>
                    <li><a href="#">New</a></li>
                    <li><a href="#">Large</a></li>
                    <li><a href="#">Small</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1>Temple Album</h1>

        <div class="temple-grid">

            <figure>
                <img src="images/temple1.jpeg" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple2.webp" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple3.jpg" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple4.jpeg" alt="Payson Utah Temple" loading="lazy">
                <figcaption>Payson Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple5.jpeg" alt="Tijuana Mexico Temple" loading="lazy">
                <figcaption>Tijuana Mexico Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple6.webp" alt="Manti Utah Temple" loading="lazy">
                <figcaption>Manti Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple7.jpg" alt="Tokyo Japan Temple" loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple8.jpeg" alt="Manila Philippines Temple" loading="lazy">
                <figcaption>Manila Philippines Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple9.jpg" alt="Bern Switzerland Temple" loading="lazy">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy;<span id="currentyear"></span>
            🌸 Julius Conteh 🌸 Freetown, Sierra Leone
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
